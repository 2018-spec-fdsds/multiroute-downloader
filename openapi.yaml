          description: Commit-pinned resolve URL; signed CDN redirects are resolved freshly for each segment.
        size:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: ^$|^[a-f0-9]{64}$
          description: Whole assembled-file LFS SHA-256; empty for Git files without published SHA-256. Never
            the Xet storage hash.
        checksum_source:
          type: string
          enum:
          - ''
          - huggingface-lfs-sha256
        storage:
          type: string
          enum:
          - git
          - lfs
          - xet
    HubSource:
      type: object
      required:
      - kind
