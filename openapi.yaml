            $ref: '#/components/schemas/HubFile'
    SourceDownloadResult:
      type: object
      required:
      - jobs
      - source
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        total_size:
          type: integer
          format: int64
          description: Selected-file byte total.
        reused_count:
          type: integer
          minimum: 0
          description: Compatible existing HTTP/Hugging Face jobs returned without starting them.
        source:
          type: object
          required:
          - kind
          properties:
            kind:
              type: string
              enum:
              - file
              - repository
              - torrent
              - metalink
              - webdav
            name:
              type: string
            info_hash_v1:
              type: string
            info_hash_v2:
              type: string
            repo_id:
              type: string
            revision:
              type: string
    Job:
      type: object
      required:
      - id
      - url
      - filename
      - status
      properties:
        expected_md5:
          type: string
          pattern: ^$|^[a-fA-F0-9]{32}$
        expected_sha512:
          type: string
          pattern: ^$|^[a-fA-F0-9]{128}$
        md5:
          type: string
          pattern: ^$|^[a-f0-9]{32}$
          description: Calculated local whole-file MD5; empty before calculation. Calculation alone is
            distinct from comparison with a publisher or manual reference.
        sha512:
          type: string
          pattern: ^$|^[a-f0-9]{128}$
          description: Calculated local whole-file SHA-512; empty before calculation. Multiple selected
            torrent files expose their individual values in files.
        checksum_sources:
          type: object
          description: Reference provenance per algorithm. Only algorithms with a known reference appear;
            a calculated local hash without a reference does not receive a publisher source label.
          additionalProperties:
            type: string
          properties:
            md5:
              type: string
            sha256:
              type: string
            sha512:
              type: string
        checksum_warnings:
          type: object
          description: Optional reference lookup warnings keyed by algorithm, replaced on each metadata
            probe. A missing reference is never reported as a successful publisher comparison. Supplied
            references still must match, and published conflicts remain fatal.
          additionalProperties:
            type: string
          properties:
            md5:
              type: string
            sha256:
              type: string
            sha512:
              type: string
        id:
          type: string
        reused:
          type: boolean
          description: Returned during duplicate creation when an existing compatible HTTP/Hugging Face job
            was selected; the job was not restarted.
        directory_updated:
          type: boolean
          description: Returned by a directory change.
        resume_preserved:
          type: boolean
          description: Verified parts retained during a directory change.
        kind:
          type: string
          enum:
          - torrent
          description: Present for BitTorrent jobs; omitted for older HTTP jobs.
        url:
          type: string
        directory:
          type: string
        filename:
          type: string
        expected_sha256:
          type: string
        checksum_source:
          type: string
          description: huggingface-lfs-sha256, Repr-Digest, file.sha256, SHA256SUMS, manual, bittorrent-piece-hashes,
            or empty when no reference checksum exists. BitTorrent piece verification is separate from local
            whole-file SHA-256. Partial-response Digest/Content-Digest are never interpreted as whole-file
            checksums.
        sha256:
          type: string
        info_hash_v1:
          type: string
        info_hash_v2:
          type: string
        pieces_complete:
          type: integer
        pieces_total:
          type: integer
        pieces_verified:
          type: boolean
          description: True only after native BitTorrent hash verification of assembled requested pieces.
        files:
          type: array
          items:
            $ref: '#/components/schemas/TorrentFile'
        size:
          type: integer
          format: int64
          description: Bytes; -1 while a source streams without known length. Final size is exact.
        downloaded:
          type: integer
          format: int64
          description: Verified completed bytes for segmented transfers; written bytes for an active whole-stream
            transfer, reset to zero when restarted.
        elapsed_ms:
          type: integer
          format: int64
          minimum: 0
          description: Persisted active download time; pause and final verification excluded.
        speed_bps:
          type: number
          minimum: 0
          description: Aggregate payload bytes per second over a three-second moving window; zero when stopped.
        eta_seconds:
          type: integer
          format: int64
          nullable: true
          minimum: 0
          description: Estimated remaining transfer time; null when unknown.
        received_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Actual received payload including retries.
        progress_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Durable bytes plus HTTP bytes in flight; may decrease on a retry.
        status:
          type: string
          enum:
          - queued
          - running
          - retrying
          - paused
          - verifying
          - complete
          - failed
          - seeding
        error:
          type: string
        source_url:
          type: string
          description: Original selected Hugging Face source.
        source_path:
          type: string
          description: Selected repository-relative path.
        repo_id:
          type: string
        revision:
          type: string
          description: Pinned source commit.
        storage:
          type: string
          enum:
          - git
          - lfs
          - xet
        source_size:
          type: integer
          format: int64
        source_sha256:
          type: string
          description: Source-published assembled-file SHA-256 when available.
        routes:
          type: array
          items:
            $ref: '#/components/schemas/RouteMetrics'
        priority:
          type: integer
          format: int64
          minimum: -100
          maximum: 100
          default: 0
        start_after_ms:
          type: integer
          format: int64
          minimum: 0
          maximum: 253402300799000
          default: 0
        file_priorities:
          type: object
          maxProperties: 1000
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
            maximum: 7
          description: Only originally selected torrent paths. 0 skips; 1..7 influences pending piece order.
            Changing live priorities pauses/requeues the torrent with verified parts preserved.
        seeding_enabled:
          type: boolean
          default: false
        seeding_minutes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1440
          default: 30
        seeding_ratio:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          default: 1.0
        idempotent_replay:
          type: boolean
        resumable:
          type: boolean
          description: False for whole-stream sources ignoring Range or without publisher identity.
        distribution_supported:
          type: boolean
          description: False for a whole-file transfer using one selected gateway.
        peers:
          type: integer
          format: int64
          minimum: 0
        seeds:
          type: integer
          format: int64
          minimum: 0
        uploaded_bytes:
          type: integer
          format: int64
          minimum: 0
        seeding_elapsed_seconds:
          type: integer
          format: int64
          minimum: 0
        seeding_ratio_actual:
