            applicable.
        size:
          type: integer
          format: int64
          minimum: 0
        pad:
          type: boolean
        sha256:
          type: string
          description: Calculated local whole-file SHA-256 after assembly; piece hashes are verified separately.
        verified:
          type: boolean
    TorrentSource:
      type: object
      required:
