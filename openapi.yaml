          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
      - gateway_statistics
  /api/v1/uploads/batch:
    post:
      operationId: createUploadBatch
      description: Requires automation_api AND batch_downloads. Gateway union policy still applies; the download
        concurrency quota of 3 is not an upload quota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - uploads
              properties:
                uploads:
                  type: array
                  items:
                    $ref: '#/components/schemas/CreateUpload'
      responses:
        '200':
          description: Per-upload results; some items may fail independently.
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
      - batch_downloads
components:
  parameters:
    JobId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-f0-9]{12}$
  responses:
    Error:
      description: Request error.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
    ProRequired:
      description: 'HTTP 403 when a required signed capability is missing: code=pro_required and feature identify
        it. Host/Origin rejection can also return a generic error without these fields.'
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            properties: &id006
              error:
                type: string
              code:
                type: string
                enum:
                - pro_required
              feature:
                type: string
                enum: &id007
                - extra_gateways
                - extra_concurrent_downloads
                - extra_site_profiles
                - download_priorities
                - gateway_priorities
                - gateway_statistics
                - batch_downloads
                - automation_api
                - premium_appearance
  schemas:
    DnsConfig:
      type: object
      additionalProperties: false
      properties:
        mode:
          type: string
          enum:
          - system
          - doh
          - dot
          default: doh
        provider:
          type: string
          enum:
          - cloudflare
          - quad9
          - google
          - custom
          default: cloudflare
        doh_url:
          type: string
          format: uri
          description: HTTPS URL with an authentication hostname; no IP literal, userinfo, query or fragment. Required
            for custom DoH.
        dot_host:
          type: string
          description: TLS authentication hostname, not an IP literal. Required for custom DoT.
        dot_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 853
          not:
            enum:
            - 53
        bootstrap_ips:
          type: array
          maxItems: 8
          items:
            type: string
            format: ipv4
          description: Literal public IPv4 addresses; at least one is required in encrypted modes. No OS bootstrap
            lookup.
        dnssec:
          type: string
          enum:
          - 'off'
          - validate
          - require
          default: validate
          description: Local cryptographic validation for DoH/DoT. Validate permits authenticated insecure delegations;
            require accepts only secure results. Bogus and indeterminate results are rejected. System mode permits
            off only and defaults to off.
      example:
        mode: doh
        provider: cloudflare
        doh_url: https://cloudflare-dns.com/dns-query
        dot_host: one.one.one.one
        dot_port: 853
        bootstrap_ips:
        - 1.1.1.1
        - 1.0.0.1
        dnssec: validate
      description: Application-scoped configuration only. Omitted preset fields take preset defaults; custom requires
        its applicable URL/hostname and numeric bootstrap addresses. Fixed presets cannot be altered. DoH/DoT verify
        trusted TLS, hostname and SNI with no plaintext/system fallback. System mode follows OS/VPN DNS policy and
        cannot guarantee gateway affinity or encryption. Does not change OS DNS/routes/interface IPs. DNSSEC settings
        are application scoped and use local dnsjava validation over the same authenticated gateway transport. The
        preset endpoint is fixed; its DNSSEC policy remains editable.
      allOf:
      - oneOf:
        - required:
          - mode
          properties:
            mode:
              enum:
              - system
            dnssec:
              enum:
              - 'off'
        - properties:
            mode:
              enum:
              - doh
              - dot
    DnsState:
      type: object
      properties:
        mode:
          type: string
          enum:
          - system
          - doh
          - dot
          default: doh
        provider:
          type: string
          enum:
          - cloudflare
          - quad9
          - google
          - custom
          default: cloudflare
        doh_url:
          type: string
          format: uri
          description: HTTPS URL with an authentication hostname; no IP literal, userinfo, query or fragment. Required
            for custom DoH.
        dot_host:
          type: string
          description: TLS authentication hostname, not an IP literal. Required for custom DoT.
        dot_port:
          type: integer
          minimum: 1
          maximum: 65535
          default: 853
          not:
            enum:
            - 53
        bootstrap_ips:
          type: array
          maxItems: 8
          items:
            type: string
            format: ipv4
          description: Literal public IPv4 addresses; at least one is required in encrypted modes. No OS bootstrap
            lookup.
        revision:
          type: integer
          format: int64
          minimum: 1
          readOnly: true
        configuration_error:
          type: string
          readOnly: true
        encrypted:
          type: boolean
          readOnly: true
          description: May be absent before service initialization.
        helper_ready:
          type: boolean
          readOnly: true
        timeout_ms:
          type: integer
          enum:
          - 8000
          readOnly: true
        plaintext_fallback:
          type: boolean
          enum:
          - false
          readOnly: true
        gateway_status:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              gateway:
                type: string
                format: ipv4
              mode:
                type: string
              provider:
                type: string
              revision:
                type: integer
                format: int64
              ok:
                type: boolean
              elapsed_ms:
                type: integer
                format: int64
              response_bytes:
                type: integer
              error:
                type: string
              at:
                type: string
                format: date-time
              dnssec:
                type: string
                enum:
                - 'off'
                - validate
                - require
                default: validate
                description: Local cryptographic validation for DoH/DoT. Validate permits authenticated insecure
                  delegations; require accepts only secure results. Bogus and indeterminate results are rejected.
                  System mode permits off only and defaults to off.
              dnssec_status:
                type: string
                enum:
                - secure
                - insecure
                - bogus
                - indeterminate
                - not_checked
                description: Local verdict; an upstream AD flag alone is never trusted. Insecure does not authenticate
                  the answer and is rejected by require mode.
              dnssec_reason_code:
                type: string
              dnssec_reason:
                type: string
              dnssec_aux_queries:
                type: integer
                minimum: 0
              dnssec_validated_ttl:
                type: integer
                minimum: 0
        dnssec:
          type: string
          enum:
          - 'off'
          - validate
          - require
          default: validate
          description: Local cryptographic validation for DoH/DoT. Validate permits authenticated insecure delegations;
            require accepts only secure results. Bogus and indeterminate results are rejected. System mode permits
            off only and defaults to off.
        dnssec_validation:
          type: string
          enum:
          - local
          - disabled
          readOnly: true
        dnssec_trust_anchors:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              key_tag:
                type: integer
              algorithm:
                type: integer
              digest_type:
                type: integer
              digest:
                type: string
          description: Bundled IANA root DS anchors. Updated with application releases; automatic RFC 5011 anchor
            management is not implemented.
      description: Standalone DNS config plus readonly runtime state. A successful changed apply returns a new revision;
        an equivalent apply may keep the current revision. Project the seven config fields before writing; never
        echo readonly metadata.
    DnsTestRequest:
      type: object
      required:
      - settings
      properties:
        settings:
          $ref: '#/components/schemas/DnsConfig'
        gateways:
          type: array
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            format: ipv4
          description: Configured gateways. Omitted means all configured gateways.
        hostname:
          type: string
          default: example.com
          description: Hostname to query for public IPv4 A answers.
    DnsTestResult:
      type: object
      required:
      - gateway
      - ok
      - elapsed_ms
      properties:
        gateway:
          type: string
          format: ipv4
        ok:
          type: boolean
        addresses:
          type: array
          items:
            type: string
            format: ipv4
        error:
          type: string
        elapsed_ms:
          type: integer
          format: int64
          minimum: 0
        dnssec:
          type: string
          enum:
          - 'off'
          - validate
          - require
          default: validate
          description: Local cryptographic validation for DoH/DoT. Validate permits authenticated insecure delegations;
            require accepts only secure results. Bogus and indeterminate results are rejected. System mode permits
            off only and defaults to off.
        dnssec_status:
          type: string
          enum:
          - secure
          - insecure
          - bogus
          - indeterminate
          - not_checked
          description: Local verdict; an upstream AD flag alone is never trusted. Insecure does not authenticate
            the answer and is rejected by require mode.
        dnssec_reason_code:
          type: string
        dnssec_reason:
          type: string
        dnssec_aux_queries:
          type: integer
          minimum: 0
        dnssec_validated_ttl:
          type: integer
          minimum: 0
    DnsTestReport:
      type: object
      required:
      - mode
      - provider
      - hostname
      - results
      - ok
      - plaintext_fallback
      - os_routes_changed
      properties:
        mode:
          type: string
          enum:
          - system
          - doh
          - dot
          default: doh
        provider:
          type: string
          enum:
          - cloudflare
          - quad9
          - google
          - custom
          default: cloudflare
        hostname:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/DnsTestResult'
        ok:
          type: boolean
          description: True only when every requested gateway row succeeded.
        plaintext_fallback:
          type: boolean
          enum:
          - false
        os_routes_changed:
          type: boolean
          enum:
          - false
        dnssec:
          type: string
          enum:
          - 'off'
          - validate
          - require
          default: validate
          description: Local cryptographic validation for DoH/DoT. Validate permits authenticated insecure delegations;
            require accepts only secure results. Bogus and indeterminate results are rejected. System mode permits
            off only and defaults to off.
        dnssec_validation:
          type: string
          enum:
          - local
          - disabled
          readOnly: true
    DnsProviders:
      type: object
      properties:
        modes:
          type: array
          items:
            type: string
            enum:
            - system
            - doh
            - dot
        plaintext_fallback:
          type: boolean
          enum:
          - false
        providers:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                enum:
                - cloudflare
                - quad9
                - google
              doh:
                $ref: '#/components/schemas/DnsConfig'
              dot:
                $ref: '#/components/schemas/DnsConfig'
    Route:
      type: object
      required:
      - type
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - direct
          - worker
          - gateway
        gateway:
          type: string
          description: LAN router used by the application stack or expected next-hop for a worker.
        gateway_priority:
          type: integer
          minimum: 0
          maximum: 1000
          description: Optional per-job override of queue.gateway_priorities for this route. Higher values are preferred for metadata and whole/single-segment files and receive more parallel range workers for multi-segment files. Equal values retain selected-route order. An explicit nonzero value requires the independent gateway_priorities Pro capability; saved values are ignored without it. Omit to inherit the global gateway setting; explicit zero overrides it.
        virtual_ip:
          type: string
          description: Application virtual IPv4 for a gateway route; defaults to configured IP.
        endpoint:
          type: string
          format: uri
          description: Required only for a legacy worker. Ignored for gateway routes.
        token:
          type: string
          writeOnly: true
          description: Optional. Omit or leave empty for a worker without a token; otherwise supply the configured
            token of at least 16 characters.
        enabled:
          type: boolean
          default: false
          description: Set true explicitly to activate this route when creating a job.
        bytes:
          type: integer
          format: int64
          readOnly: true
        chunks:
          type: integer
          format: int64
          readOnly: true
        last_error:
          type: string
          readOnly: true
        site_profile_id:
          type: string
          format: uuid
          description: Explicit saved site profile. Credentials are isolated by profile and exact origin; no global
            credential fallback for a selected profile.
    RouteMetrics:
      allOf:
      - $ref: '#/components/schemas/Route'
      - type: object
        properties:
          received_bytes:
            type: integer
            format: int64
            minimum: 0
          speed_bps:
            type: number
            minimum: 0
            description: Actual received payload bytes per second; zero when stopped.
          bytes:
            type: integer
            format: int64
            minimum: 0
            description: Verified bytes saved through this gateway.
          chunks:
            type: integer
            minimum: 0
          last_error:
            type: string
          peers:
            type: integer
            format: int64
            minimum: 0
          seeds:
            type: integer
            format: int64
            minimum: 0
          uploaded_bytes:
            type: integer
            format: int64
            minimum: 0
          upload_speed_bps:
            type: integer
            format: int64
            minimum: 0
          tracker_status:
            type: string
          source_url_active:
            type: string
            format: uri
    ReplaceJobGateways:
      type: object
      required:
      - routes
      properties:
        routes:
          type: array
          minItems: 1
          maxItems: 8
          description: Full desired set of 1 to 8 distinct configured gateways. At least one enabled gateway is
            required; omitted historical routes become disabled. No OS route changes.
          items:
            allOf:
            - $ref: '#/components/schemas/Route'
            - type: object
              required:
              - type
              - gateway
              - enabled
              properties:
                type:
                  type: string
                  enum:
                  - gateway
                enabled:
                  type: boolean
                  description: Set true to include this gateway; false entries are ignored.
    CreateJob:
      type: object
      required:
      - url
      - routes
      properties:
        expected_md5:
          type: string
          pattern: ^$|^[a-fA-F0-9]{32}$
          description: Optional expected whole-file MD5. It detects accidental corruption and does not replace strong
            source identity, mirror trust or BitTorrent piece verification. Manual whole-file checksums require
            exactly one selected file.
        expected_sha512:
          type: string
          pattern: ^$|^[a-fA-F0-9]{128}$
          description: Optional expected whole-file SHA-512. Every supplied or discovered checksum must match before
            publishing the completed file. Legacy expected_sha256 remains supported.
        url:
          type: string
          description: HTTP/HTTPS/FTP/explicit FTPS/SFTP file, webdavs:// source, HTTPS Metalink, Hugging Face,
            .torrent URL/local path or magnet. HTTP without Range supports one whole transfer of any size, including
            unknown Content-Length; no resume/distribution is claimed.
        source_type:
          type: string
          enum:
          - torrent
          - metalink
          - webdav
          description: Explicit source metadata format override.
        info_hash_v1:
          type: string
          pattern: ^[a-fA-F0-9]{40}$
          description: Optional expected torrent info-hash from inspect; source mismatch is rejected.
        info_hash_v2:
          type: string
          pattern: ^[a-fA-F0-9]{64}$
          description: Optional expected v2 torrent info-hash from inspect.
        directory:
          type: string
          description: Absolute or relative destination directory.
        filename:
          type: string
        expected_sha256:
          type: string
          pattern: ^$|^[a-fA-F0-9]{64}$
          description: Optional trusted SHA-256; the controller also discovers published SHA-256 automatically.
        chunk_mb:
          type: integer
          minimum: 1
          maximum: 64
          default: 20
        routes:
          type: array
          items:
            $ref: '#/components/schemas/Route'
          minItems: 1
          description: At most 8 enabled independent gateways after normalization; historical disabled/legacy route
            descriptions can remain.
        selected_files:
          type: array
          minItems: 1
          maxItems: 1000
          uniqueItems: true
          description: Paths from inspect; required for a repository or multi-file torrent. Pad files are not selectable.
          items:
            type: string
        revision:
          type: string
          pattern: ^[a-fA-F0-9]{40}$
          description: Exact Hugging Face commit chosen from inspect.
        idempotency_key:
          type: string
          pattern: ^[A-Za-z0-9_.:-]{1,128}$
          description: Alternative to Idempotency-Key header on POST /jobs; per-item key in batch.
        mirrors:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: string
            format: uri
          description: Trusted alternative file URLs; requires expected_sha256. Publisher Metalink provides these
            automatically.
        priority:
          type: integer
          format: int64
          minimum: -100
          maximum: 100
          default: 0
        start_after_ms:
          type: integer
          format: int64
          minimum: 0
          maximum: 253402300799000
          default: 0
        file_priorities:
          type: object
          maxProperties: 1000
          additionalProperties:
            type: integer
            format: int64
            minimum: 0
            maximum: 7
          description: Only originally selected torrent paths. 0 skips; 1..7 influences pending piece order. Changing
            live priorities pauses/requeues the torrent with verified parts preserved.
        seeding_enabled:
          type: boolean
          default: false
        seeding_minutes:
          type: integer
          format: int64
          minimum: 1
          maximum: 1440
          default: 30
        seeding_ratio:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 100
          default: 1.0
        site_profile_id:
          type: string
          format: uuid
          description: Explicit saved site profile. Credentials are isolated by profile and exact origin; no global
            credential fallback for a selected profile.
    CreateSourceDownload:
      allOf:
      - $ref: '#/components/schemas/CreateJob'
    TorrentFile:
      type: object
      required:
      - path
      - size
      properties:
        md5:
          type: string
          pattern: ^$|^[a-f0-9]{32}$
          description: Local whole-file MD5 after assembly; separate from mandatory torrent piece checks.
        sha512:
          type: string
          pattern: ^$|^[a-f0-9]{128}$
          description: Local whole-file SHA-512 after assembly; separate from mandatory torrent piece checks.
        index:
          type: integer
        path:
          type: string
          description: Exact portable path from authenticated metainfo, including the torrent root folder when applicable.
        size:
          type: integer
          format: int64
          minimum: 0
        pad:
          type: boolean
        sha256:
          type: string
          description: Calculated local whole-file SHA-256 after assembly; piece hashes are verified separately.
        verified:
          type: boolean
    TorrentSource:
      type: object
      required:
      - kind
      - name
      - files
      - info_hash_v1
      - info_hash_v2
      properties:
        kind:
          type: string
          enum:
          - torrent
        source:
          type: string
        name:
          type: string
        info_hash_v1:
          type: string
        info_hash_v2:
          type: string
        size:
          type: integer
          format: int64
        pieces:
          type: integer
        checksum_source:
          type: string
          enum:
          - bittorrent-piece-hashes
        files:
          type: array
          items:
            $ref: '#/components/schemas/TorrentFile'
    HubFile:
      type: object
      required:
      - path
      - filename
      - url
      - size
      - sha256
      - checksum_source
      - storage
      properties:
        path:
          type: string
          description: Path relative to the repository root.
        filename:
          type: string
        url:
          type: string
          format: uri
          description: Commit-pinned resolve URL; signed CDN redirects are resolved freshly for each segment.
        size:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
          pattern: ^$|^[a-f0-9]{64}$
          description: Whole assembled-file LFS SHA-256; empty for Git files without published SHA-256. Never the
            Xet storage hash.
        checksum_source:
          type: string
          enum:
          - ''
          - huggingface-lfs-sha256
        storage:
          type: string
          enum:
          - git
          - lfs
          - xet
    HubSource:
      type: object
      required:
      - kind
      - source_url
      - repo_id
      - repo_type
      - revision
      - files
      properties:
        kind:
          type: string
          enum:
          - file
          - repository
        source_url:
          type: string
          format: uri
        repo_id:
          type: string
        repo_type:
          type: string
          enum:
          - model
          - dataset
          - space
        revision:
          type: string
          pattern: ^[a-f0-9]{40}$
        files:
          type: array
          items:
            $ref: '#/components/schemas/HubFile'
    SourceDownloadResult:
      type: object
      required:
      - jobs
      - source
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/Job'
        total_size:
          type: integer
          format: int64
          description: Selected-file byte total.
        reused_count:
          type: integer
          minimum: 0
          description: Compatible existing HTTP/Hugging Face jobs returned without starting them.
        source:
          type: object
          required:
          - kind
          properties:
            kind:
              type: string
              enum:
              - file
              - repository
              - torrent
              - metalink
              - webdav
            name:
              type: string
            info_hash_v1:
              type: string
            info_hash_v2:
              type: string
            repo_id:
              type: string
            revision:
              type: string
    DownloadLifecycleEvent:
      type: object
      required:
      - event_id
      - job_id
      - kind
      - time
      - filename
      - path
      properties:
        event_id:
          type: string
          format: uuid
        job_id:
          type: string
          pattern: ^[a-f0-9]{12}$
        kind:
          type: string
          enum:
          - started
          - resumed
          - paused
          - completed
          - recovered
          - failed
        time:
          type: string
          format: date-time
          description: Actual observed event time in ISO 8601 UTC.
        filename:
          type: string
          description: Full display filename recorded when this event occurred.
        path:
          type: string
          description: Absolute destination path recorded when this event occurred.
        paths:
          type: array
          items:
            type: string
          description: Absolute selected-file destination paths for a torrent job, when present.
        reason:
          type: string
          enum:
          - pause
          - shutdown
          - maintenance
          description: Optional pause reason.
      additionalProperties: false
    Job:
      type: object
      required:
      - id
      - url
      - filename
      - status
      properties:
        first_started_at:
          type: string
          format: date-time
          description: First observed execution start in ISO 8601 UTC. Absent before execution or when an old job
            has no observed original start.
        last_resumed_at:
          type: string
          format: date-time
          description: Latest observed continuation in ISO 8601 UTC; absent until a continuation is recorded.
        completed_at:
          type: string
          format: date-time
          description: Observed successful completion after verification and publication. Recovery of an older published
            file does not invent this timestamp.
        lifecycle_history:
          type: array
          readOnly: true
          description: Persisted observed lifecycle events for this job. Queued jobs have no execution-start event
            yet; historical timestamps of legacy jobs are never guessed.
          items:
            $ref: '#/components/schemas/DownloadLifecycleEvent'
        expected_md5:
          type: string
          pattern: ^$|^[a-fA-F0-9]{32}$
        expected_sha512:
          type: string
          pattern: ^$|^[a-fA-F0-9]{128}$
        md5:
          type: string
          pattern: ^$|^[a-f0-9]{32}$
          description: Calculated local whole-file MD5; empty before calculation. Calculation alone is distinct
            from comparison with a publisher or manual reference.
        sha512:
          type: string
          pattern: ^$|^[a-f0-9]{128}$
          description: Calculated local whole-file SHA-512; empty before calculation. Multiple selected torrent
            files expose their individual values in files.
        checksum_sources:
          type: object
          description: Reference provenance per algorithm. Only algorithms with a known reference appear; a calculated
            local hash without a reference does not receive a publisher source label.
          additionalProperties:
            type: string
          properties:
            md5:
              type: string
            sha256:
