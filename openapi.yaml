        url:
          type: string
        format:
          type: string
          enum:
          - ''
          - ZIP
          - TAR
          - 7Z
          - RAR4
          - RAR5
        entries:
          type: array
          items:
            $ref: '#/components/schemas/ArchiveEntry'
        metadata_budget_bytes:
          type: integer
          enum:
          - 16777216
        bytes_fetched:
          type: integer
          format: int64
        truncated:
          type: boolean
        range_supported:
          type: boolean
        password_required:
          type: boolean
        message:
          type: string
    BrowserLink:
      type: object
      additionalProperties: false
      required:
      - url
      properties:
        url:
          type: string
          maxLength: 16384
          description: One explicit HTTP(S)/FTP/FTPS/SFTP/webdavs/magnet link without embedded credentials or fragment.
            No cookies, headers or arbitrary job options.
    LicenseRequirementError:
      type: object
      required:
      - error
      - code
      - feature
      properties: *id006
    EditableChecksum:
      type: object
      additionalProperties: false
      required:
      - expected_checksum
      properties:
        expected_checksum:
          type: string
          description: 'Empty clears the manual reference; otherwise 32/64/128 hexadecimal digits after stripping
            outer whitespace, case-insensitive: MD5/SHA-256/SHA-512. Exactly this one string property is accepted.
            This setter is separate from creation fields expected_md5/expected_sha256/expected_sha512.'
    OfflineLicenseStatus:
      type: object
      properties:
        mode:
          type: string
          enum:
          - offline
        edition:
          type: string
          enum:
          - free
          - pro
        status:
          type: string
        binding:
          type: string
          description: 'Windows: windows_dpapi_current_user; software_key_file on current Linux/macOS implementation.'
        features:
          type: array
          items:
            type: string
          description: Signed capability IDs; legacy reserved IDs remain recognized, but do not replace active 4.3.0
            rights.
        holder_label:
          type: string
        license_id:
          type: string
        major_min:
          type: integer
        major_max:
          type: integer
      description: Public metadata only, no full license token or private key. GET does not create an installation
        identity. License belongs to the installation key, not MAC/IP, with no time expiry.
    LicensePolicySnapshot:
      type: object
      properties:
        mode:
          type: string
          enum:
          - offline
        edition:
          type: string
          enum:
          - free
          - pro
        status:
          type: string
        binding:
          type: string
          description: 'Windows: windows_dpapi_current_user; software_key_file on current Linux/macOS implementation.'
        features:
          type: object
          properties:
            extra_gateways:
              type: boolean
            extra_concurrent_downloads:
              type: boolean
            extra_site_profiles:
              type: boolean
            download_priorities:
              type: boolean
            gateway_priorities:
              type: boolean
            gateway_statistics:
              type: boolean
            batch_downloads:
              type: boolean
            automation_api:
              type: boolean
            premium_appearance:
              type: boolean
          additionalProperties: false
        holder_label:
          type: string
        license_id:
          type: string
        major_min:
          type: integer
        major_max:
          type: integer
        granted_features:
          type: array
          items:
            type: string
            enum: *id007
        max_gateways:
          type: integer
          format: int64
          minimum: 0
        max_concurrent_downloads:
          type: integer
          format: int64
          minimum: 0
        max_site_profiles:
          type: integer
          format: int64
          minimum: 0
          description: Free creation cap is 3; see site_profiles_unlimited for Pro. Existing legacy profiles are
            retained.
        active_downloads:
          type: integer
          format: int64
          minimum: 0
        active_download_count:
          type: integer
          format: int64
          minimum: 0
        site_profiles:
          type: integer
          format: int64
          minimum: 0
        siteprofile_count:
          type: integer
          format: int64
          minimum: 0
        configured_max_active_jobs:
          type: integer
          format: int64
          minimum: 0
        effective_max_active_jobs:
          type: integer
          format: int64
          minimum: 0
        active_uploads:
          type: integer
          format: int64
          minimum: 0
        pending_or_active_downloads:
          type: integer
          format: int64
          minimum: 0
        active_checksum_checks:
          type: integer
          format: int64
          minimum: 0
        active_transfers:
          type: integer
          format: int64
          minimum: 0
        site_profiles_unlimited:
          type: boolean
        checksum_checking:
          type: boolean
        network_busy:
          type: boolean
        used_gateways:
          type: array
          items:
            type: string
      description: 'Capabilities are independent. Free effective limits: 2 shared gateways, 3 concurrent download
        tasks, 3 new profiles. active_transfers includes pending/running downloads (including checksum workers)
        and uploads; checksum work is not double-counted. Complete alone is not proof of idle.'
    ApplicationMac:
      type: object
      properties:
        mac:
          type: string
          description: Canonical local-unicast xx:xx:xx:xx:xx:xx; may be empty before initialization.
        pool:
          type: string
          enum:
          - locally_administered_unicast_46_bit
        source:
          type: string
          enum:
          - derived_client_identifier
          - override
          - uninitialized
        conflict_status:
          type: string
          enum:
          - not_checked
          - not_detected
          - detected
        global_availability_proven:
          type: boolean
          enum:
          - false
      description: Own stable application MAC in manual-IP and DHCP modes, distinct from the physical NIC MAC. Pool
        is not DHCP. Checks observed devices and cooperative MultiRoute announcements; no conflict detected is not
        a global availability guarantee. GET only observes state; it never starts helper/capture/probes. MAC changes
        are provided by desktop UI, not a new external endpoint.
  securitySchemes:
    PrivateInstanceKey:
      type: apiKey
      in: header
      name: X-Instance-Key
      description: Private per-instance lifecycle secret only. Not a Pro license key and not an ordinary API token.
