- /
- /index.html
- /api/v1/instance
- /api/v1/health
- /api/v1/license/status
- /api/v1/license/policy
- /api/state
- /api/v1/jobs
- /api/v1/uploads
- /api/v1/network
- /api/v1/network/dns
- /api/jobs/{id}
- /api/v1/jobs/{id}
- /api/v1/uploads/{id}
x-free-diagnostic-id-pattern: ^[a-f0-9]{12}$
x-free-lifecycle-POST-allowlist:
- /api/v1/instance/stop
x-free-browser-exception: 'Existing opt-in fixed-extension-Origin bridge: status and one URL passed to the desktop
  UI; no general management/batch API access.'
x-free-limits:
  gateways_in_use_union_download_upload: 2
  concurrent_download_tasks: 3
  new_site_profiles: 3
  appearance:
  - graphite
  - system
  artificial_speed_throttle: false
  upload_concurrency_limit_of_three: false
x-active-Pro-capabilities: *id007
x-partial-license-policy: Only explicitly granted signed capabilities are enabled. Existing profiles, gateway lists
  and transfer progress are retained. Basic resume, checksums, protected DNS, live speed/status and scheduling remain
  available in the UI. Normal external API calls still require automation_api.
