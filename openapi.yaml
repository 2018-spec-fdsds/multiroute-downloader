openapi: 3.0.3
info:
  title: MultiRoute Downloader local API
  version: 4.3.7
  description: Localhost-only native desktop/headless API. Canonical JSON is independent of UI language. Request
    bodies are limited to 1 MiB; explicit Content-Length is optional. JSON text is UTF-8. No ordinary API token
    is used. External management requires the signed automation_api capability; additional product capabilities
    are checked independently. Licensing is bound to the installation key, not MAC/IP. Narrow
    Free diagnostics and private authenticated lifecycle calls are listed below. Do not expose this localhost API
    to LAN/Internet.
servers:
- url: http://127.0.0.1:8765
paths:
  /api/v1/sources/inspect:
    post:
      operationId: inspectSource
      description: Inspect HTTP/HTTPS/FTP/FTPS/SFTP, authenticated Hugging Face, torrent/magnet, HTTPS Metalink
        .meta4 and HTTPS WebDAV (webdavs:// or source_type=webdav). A selected application gateway transports new
        source protocols/metadata. FTP is passive; FTPS uses explicit TLS for control and data; SFTP requires a
        pinned verified SHA256 host key. Raw metainfo/resume data and credential secrets are not returned. Ordinary
        files use a probe request and can report unknown size -1.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              properties:
                url:
                  type: string
                  description: HTTP(S) URL, magnet:? URI or explicitly supplied local .torrent path.
                source_type:
                  type: string
                  enum:
                  - torrent
                  - metalink
                  - webdav
                  description: Optional; explicitly treats a URL without a .torrent extension as torrent metainfo.
                revision:
                  type: string
                  pattern: ^[a-fA-F0-9]{40}$
                  description: Optional exact repository commit.
                route:
                  $ref: '#/components/schemas/Route'
                routes:
                  type: array
                  description: Alternative to route; the first enabled route reads metadata. Torrent and magnet
                    require type=gateway.
                  items:
                    $ref: '#/components/schemas/Route'
                site_profile_id:
                  type: string
                  format: uuid
                  description: Explicit saved site profile. Credentials are isolated by profile and exact origin;
                    no global credential fallback for a selected profile.
      responses:
        '200':
          description: Source metadata or file choices.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/HubSource'
                - $ref: '#/components/schemas/TorrentSource'
                - $ref: '#/components/schemas/SourceListing'
                - $ref: '#/components/schemas/FileSource'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/sources/download:
    post:
      operationId: downloadSelectedSourceFiles
      description: Create selected Hugging Face/Metalink/WebDAV jobs, one torrent job or one ordinary source file.
        selected_files is required for repository/listing or multi-file torrent. names and metadata bind selection;
        compatible old jobs are returned with reused=true without restarting. Returns jobs/source batch shape. Jobs
        start through queue policy. Auth must first be saved via source-auth. Torrent piece hashes and publisher
        whole/piece SHA are verified; identical size alone never establishes mirror identity.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSourceDownload'
      responses:
        '201':
          description: New selected jobs started, compatible existing jobs returned without restarting.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceDownloadResult'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
      x-license-conditions:
      - batch_downloads for several selected source/torrent files
      - extra_gateways for more than 2 gateways in shared use
      - extra_concurrent_downloads to run more than 3 downloads concurrently; queue setting still applies
  /api/v1/network/dns:
    get:
      operationId: getDnsSettings
      responses:
        '200':
          description: Application DNS config and readonly status; does not start the native helper.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsState'
      x-required-capabilities: []
    put:
      operationId: applyDnsSettings
      description: Validate and persist only the six configuration fields. Applies to subsequent DNS lookups and
        invalidates the old policy cache; existing payload TCP streams remain. Returns the standalone DNS state.
        No OS DNS/routes/IP changes. No credentials or readonly revision/status fields are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DnsConfig'
      responses:
        '200':
          description: Applied DNS configuration and returned revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsState'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
    post:
      operationId: applyDnsSettingsCompat
      description: Validate and persist only the six configuration fields. Applies to subsequent DNS lookups and
        invalidates the old policy cache; existing payload TCP streams remain. Returns the standalone DNS state.
        No OS DNS/routes/IP changes. No credentials or readonly revision/status fields are accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DnsConfig'
      responses:
        '200':
          description: Applied DNS configuration and returned revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsState'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/network/dns/test:
    post:
      operationId: testDnsSettings
      description: Tests an unsaved draft through selected configured gateways without saving or changing revision.
        HTTP 200 may contain partial failure and ok=false; inspect every row. System success checks OS resolution,
        not independent gateway WAN reachability. Each query has an 8-second total budget.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DnsTestRequest'
      responses:
        '200':
          description: Per-gateway DNS results; this is not a file-transfer success report.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsTestReport'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/network/dns/providers:
    get:
      operationId: getDnsProviders
      description: Three fixed provider presets with full DoH/DoT configurations. Custom is an allowed configurable
        provider rather than a fourth preset.
      responses:
        '200':
          description: Supported modes and fixed Cloudflare/Quad9/Google presets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DnsProviders'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/network:
    get:
      operationId: getApplicationNetwork
      responses:
        '200':
          description: Virtual IPv4, configured routers and network helper state. No OS routes or IP configuration
            are edited. network_validation contains fresh native subnet evidence; GET never starts the helper.
          content:
            application/json:
              schema:
                type: object
                properties:
                  dns:
                    $ref: '#/components/schemas/DnsState'
                  virtual_ip:
                    type: string
                  gateways:
                    type: array
                    items:
                      type: string
                  running:
                    type: boolean
                  os_routes_changed:
                    type: boolean
                    enum:
                    - false
                  network_validation:
                    type: object
                    required:
                    - status
                    - message
                    properties:
                      status:
                        type: string
                        enum:
                        - pending
                        - valid
                        - error
                      message:
                        type: string
                        description: Canonical diagnostic text; desktop presentation translates it.
                      computer_ipv4:
                        type: string
                      netmask:
                        type: string
                      prefix_length:
                        type: integer
                        minimum: 1
                        maximum: 30
                      network_cidr:
                        type: string
                      interface_index:
                        type: integer
                      network_generation:
                        type: integer
                        description: Increases when the observed computer IPv4 changes on the selected LAN.
                  application_mac:
                    $ref: '#/components/schemas/ApplicationMac'
      x-required-capabilities: []
    post:
      operationId: configureApplicationNetwork
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - virtual_ip
              - gateways
              properties:
                virtual_ip:
                  type: string
                  example: 192.168.1.70
                gateways:
                  type: array
                  minItems: 1
                  maxItems: 8
                  uniqueItems: true
                  items:
                    type: string
      responses:
        '200':
          description: Configuration applied and saved.
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      description: Configure 1..8 gateways, default four. Same virtual IP allows appending/removing profiles during
        transfers without restarting other gateway connections. Removal disables affected job routes and returns
        unfinished chunks; at least one gateway must remain for every unfinished job. Added profiles are not automatically
        selected in existing jobs. Same-IP topology editing works offline; actual address/route checks occur explicitly
        or when the helper starts. Changing virtual IP requires active jobs to pause.
      x-required-capabilities:
      - automation_api
  /api/v1/gateways/speed:
    post:
      operationId: measureGatewaySpeed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - gateway
              properties:
                gateway:
                  type: string
                  example: 192.168.1.3
                url:
                  type: string
                  description: Optional HTTP(S) Range file; defaults to the Selectel sample.
      responses:
        '200':
          description: Actual bytes and throughput through the specified router.
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/health:
    get:
      operationId: health
      responses:
        '200':
          description: Controller is running.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  version:
                    type: string
      x-required-capabilities: []
  /api/v1/jobs:
    get:
      operationId: listJobs
      responses:
        '200':
          description: All jobs and their current progress.
          content:
            application/json:
              schema:
                type: object
                required:
                - jobs
                properties:
                  jobs:
                    type: array
                    items:
                      $ref: '#/components/schemas/Job'
      x-required-capabilities: []
    post:
      operationId: createJob
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJob'
      responses:
        '201':
          description: Job(s) accepted through persisted queue policy; may still be queued. Existing compatible
            jobs are reused without automatic restart. Idempotent replay returns the earlier creation result.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/Job'
                - $ref: '#/components/schemas/SourceDownloadResult'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          pattern: ^[A-Za-z0-9_.:-]{1,128}$
        description: 'Same canonical input replays earlier result with idempotent_replay=true. Different input with
          same key fails. Persistent profile-scoped registry: 1024 keys, 7-day registry TTL; manifests permit interrupted-write
          recovery. Use a new key after removing the associated single job.'
      x-required-capabilities:
      - automation_api
      x-license-conditions:
      - batch_downloads for several selected source/torrent files
      - extra_gateways for more than 2 gateways in shared use
      - extra_concurrent_downloads to run more than 3 downloads concurrently; queue setting still applies
  /api/v1/jobs/{id}:
    parameters:
    - $ref: '#/components/parameters/JobId'
    get:
      operationId: getJob
      responses:
        '200':
          description: One job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Error'
      x-required-capabilities: []
    delete:
      operationId: removeJob
      parameters:
      - name: delete_files
        in: query
        required: false
        schema:
          type: boolean
          default: false
        description: Explicitly delete this job's downloaded files and unfinished parts.
      description: Stops the selected job and removes its history record. By default all downloaded files and unfinished
        parts/cache are kept. With delete_files=true removes only owned unfinished data and verified published files
        of this job. Never removes the download directory or unrelated files. Destructive file deletion may be partial
        if filesystem operations fail.
      responses:
        '200':
          description: Job removed; files kept unless delete_files=true.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  id:
                    type: string
                  removed:
                    type: boolean
                  completed_files_kept:
                    type: boolean
                  unfinished_parts_kept:
                    type: boolean
                  kept_paths:
                    type: array
                    items:
                      type: string
                  deleted_files:
                    type: array
                    items:
                      type: string
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/jobs/{id}/routes:
    parameters:
    - $ref: '#/components/parameters/JobId'
    put:
      operationId: replaceJobGateways
      description: Replaces the full enabled gateway set for an existing HTTP or torrent job. Select one to 8 distinct
        gateways from current network settings. Checked before applying; running jobs keep verified parts, cancel
        unfinished transfers on removed gateways and give new work to added gateways. Historical route counters
        are retained with enabled=false. Paused/failed jobs remain stopped. Completed/verifying jobs and jobs stopping
        or under maintenance reject the operation. An unfinished transfer with no new payload for 60 seconds is
        cancelled and returned to the shared pool after its writer releases storage. Does not edit OS routes, the
        virtual IP or global gateway configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceJobGateways'
      responses:
        '200':
          description: Updated job with the desired enabled gateways; verified progress retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
    post:
      operationId: replaceJobGatewaysCompat
      description: Compatible alias of PUT at the same path; the body is the full desired gateway set, not an incremental
        patch.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceJobGateways'
      responses:
        '200':
          description: Updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/jobs/{id}/directory:
    parameters:
    - $ref: '#/components/parameters/JobId'
    post:
      operationId: changeJobDirectory
      description: Changes the output folder of a paused or failed job, retaining verified parts and without starting
        the download. Select a folder with enough free space; existing files are never overwritten.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - directory
              properties:
                directory:
                  type: string
      responses:
        '200':
          description: Updated job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/jobs/{id}/pause:
    parameters:
    - $ref: '#/components/parameters/JobId'
    post:
      operationId: pauseJob
      responses:
        '200':
          description: Paused job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/jobs/{id}/resume:
    parameters:
    - $ref: '#/components/parameters/JobId'
    post:
      operationId: resumeJob
      responses:
        '200':
          description: Resumed job.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/routes/test:
    post:
      operationId: testRoute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Route'
      responses:
        '200':
          description: Egress probe and gateway check.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  egress_ip:
                    type: string
                  gateway_hint:
                    type: string
                  expected_gateway:
                    type: string
                  gateway_match:
                    type: boolean
                    nullable: true
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/routes/speed:
    post:
      operationId: measureRouteSpeed
      description: Downloads a bounded sample through the actual route transport, without creating a job or saving
        a file. Compare channels with sequential calls.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - route
              properties:
                route:
                  $ref: '#/components/schemas/Route'
                url:
                  type: string
                  description: HTTP(S) Range source. Empty or omitted selects the Selectel test file.
      responses:
        '200':
          description: Measured throughput for this channel.
          content:
            application/json:
              schema:
                type: object
                required:
                - ok
                - mbps
                - mib_per_second
                - bytes
                - elapsed_ms
                - url
                - limit_reached
                properties:
                  ok:
                    type: boolean
                  mbps:
                    type: number
                    description: Megabits per second; decimal units.
                  mib_per_second:
                    type: number
                    description: Mebibytes per second.
                  bytes:
                    type: integer
                    format: int64
                  elapsed_ms:
                    type: number
                  url:
                    type: string
                    format: uri
                  route_name:
                    type: string
                  gateway:
                    type: string
                  limit_reached:
                    type: boolean
                  max_bytes:
                    type: integer
                    format: int64
                  duration_limit_ms:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/routes/discover:
    get:
      operationId: discoverGateways
      description: Collects IPv4 LAN worker announcements for up to two seconds. Verify any chosen gateway with
        the route probe before use.
      responses:
        '200':
          description: Advertised gateway IP to worker endpoint mapping.
          content:
            application/json:
              schema:
                type: object
                required:
                - gateways
                properties:
                  gateways:
                    type: object
                    additionalProperties:
                      type: string
                      format: uri
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/routes/inspect:
    post:
      operationId: inspectLocalGateway
      description: Checks the application Ethernet path and gateway ARP response. Uses a private virtual IP, never
        edits OS routes or addresses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - gateway
              properties:
                gateway:
                  type: string
                  description: Requested LAN gateway of the application TCP/IP stack.
                url:
                  type: string
                  description: Source URL. Empty selects the standard speed source.
      responses:
        '200':
          description: Route availability and a visible explanation, including invalid or unconfirmed gateway addresses.
          content:
            application/json:
              schema:
                type: object
                required:
                - gateway
                - available
                - type
                - status
                - message
                properties:
                  gateway:
                    type: string
                  available:
                    type: boolean
                  type:
                    type: string
                    enum:
                    - gateway
                  status:
                    type: string
                  message:
                    type: string
                  destination:
                    type: string
                  gateway_hint:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/dialogs/directory:
    post:
      operationId: chooseDirectory
      description: Opens a native folder chooser on the controller computer when a graphical desktop is available.
        Headless clients should supply the directory path directly when creating a job.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                initial:
                  type: string
                  description: Initial directory.
      responses:
        '200':
          description: Selected path or cancellation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  path:
                    type: string
                  cancelled:
                    type: boolean
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/queue:
    get:
      operationId: getQueueSettings
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSettings'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
    put:
      operationId: updateQueueSettings
      description: Partial queue policy update; payload bytes/s (0 unlimited), computer local timezone, equal start/end
        all day, overnight windows supported. Scheduled pauses become queued; manually paused jobs remain paused.
        Lowering concurrency stops new starts without cancelling current jobs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueOptions'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSettings'
        '400': &id001
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
    post:
      operationId: updateQueueSettingsCompat
      description: Partial queue policy update; payload bytes/s (0 unlimited), computer local timezone, equal start/end
        all day, overnight windows supported. Scheduled pauses become queued; manually paused jobs remain paused.
        Lowering concurrency stops new starts without cancelling current jobs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueOptions'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueSettings'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
  /api/v1/jobs/{id}/options:
    parameters:
    - $ref: '#/components/parameters/JobId'
    put:
      operationId: updateJobOptions
      description: Partial update. Higher priority starts first; start_after_ms is Unix milliseconds. Optional seeding
        defaults off and follows verified assembly through selected gateways, limited by time or measured ratio.
        Upload-only sessions do not request missing pieces; upload cap 1 MiB/s per session. Saving unchanged file
        priorities does not restart transfer.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobOptions'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
        '400': *id001
        '403':
          $ref: '#/components/responses/ProRequired'
      x-required-capabilities:
      - automation_api
      x-license-conditions:
      - download_priorities for non-default priority; stored priority is retained without enforcement in Free
    post:
      operationId: updateJobOptionsCompat
      description: Partial update. Higher priority starts first; start_after_ms is Unix milliseconds. Optional seeding
