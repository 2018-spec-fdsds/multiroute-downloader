name: Native macOS installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    timeout-minutes: 35
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            architecture: arm64
          - runner: macos-15-intel
            architecture: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Installer binaries in downloads/ are outputs, not build inputs.
          sparse-checkout: |
            .github
            browser-extension
            docs
            lib
            linux
            macOS
            native
            packaging
            scripts
            src
            windows
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          architecture: ${{ matrix.architecture == 'arm64' && 'aarch64' || 'x64' }}
      - name: Build pinned native app, six C fixtures including managed DNS broker and Installer
        run: python3 packaging/macos/build.py --architecture '${{ matrix.architecture }}' --output dist/macos
      - name: Verify identities, DNS169, RESOLVE145, broker191/63, secure DNS42, managed DNS147, HTTP2 DNS106 and UI891
        run: python3 packaging/macos/verify.py --directory dist/macos
      - uses: actions/upload-artifact@v4
        with:
          name: multiroute-macos-${{ matrix.architecture }}
          path: |
            dist/macos/*.pkg
            dist/macos/*report.json
          if-no-files-found: error
          retention-days: 7

  linux-dns:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            native
            packaging
            src
            lib
            scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install native compiler dependencies on the disposable CI runner
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config libpcap-dev
      - name: Verify Linux helper, six native fixtures and three Java DNS TLS fixtures without capture
        run: bash packaging/tests/verify_linux_dns.sh "$GITHUB_WORKSPACE" "$RUNNER_TEMP/multiroute-dns420"
      - name: Preserve owned text diagnostics on Linux verification failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: multiroute-linux-dns-failure
          path: |
            ${{ runner.temp }}/multiroute-dns420/*.log
            ${{ runner.temp }}/multiroute-dns420/*-stderr.txt
            ${{ runner.temp }}/multiroute-dns420/*-output.txt
            ${{ runner.temp }}/multiroute-dns420/java-dns/**/*.log
            ${{ runner.temp }}/multiroute-dns420/**/VERIFICATION.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: multiroute-linux-dns
          path: ${{ runner.temp }}/multiroute-dns420/VERIFICATION.json
          if-no-files-found: error
          retention-days: 7
