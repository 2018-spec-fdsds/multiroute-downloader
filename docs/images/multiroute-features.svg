<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="214" viewBox="0 0 1400 214" role="img" aria-labelledby="title"><title id="title">More capacity, resilient downloads, file integrity and automation</title><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"/><rect x="22" y="25" width="35" height="4" rx="2" fill="#5cbaff"/><text x="22" y="63" fill="#5cbaff" font-size="12" font-weight="bold" letter-spacing="1.5">MULTI-GATEWAY</text><text x="22" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">More capacity</text><text x="22" y="148" fill="#b9c8e4" font-size="15">Share file segments across</text><text x="22" y="173" fill="#b9c8e4" font-size="15">independent Internet uplinks.</text><rect x="354" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"/><rect x="376" y="25" width="35" height="4" rx="2" fill="#5eead4"/><text x="376" y="63" fill="#5eead4" font-size="12" font-weight="bold" letter-spacing="1.5">RESILIENT DOWNLOADS</text><text x="376" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Keep your progress</text><text x="376" y="148" fill="#b9c8e4" font-size="15">Resume interrupted transfers;</text><text x="376" y="173" fill="#b9c8e4" font-size="15">reassign work from a stalled route.</text><rect x="708" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"/><rect x="730" y="25" width="35" height="4" rx="2" fill="#b49bff"/><text x="730" y="63" fill="#b49bff" font-size="12" font-weight="bold" letter-spacing="1.5">FILE INTEGRITY</text><text x="730" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Verify the result</text><text x="730" y="148" fill="#b9c8e4" font-size="15">Compare published or supplied</text><text x="730" y="173" fill="#b9c8e4" font-size="15">SHA-256, SHA-512 and MD5 values.</text><rect x="1062" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"/><rect x="1084" y="25" width="35" height="4" rx="2" fill="#f7c776"/><text x="1084" y="63" fill="#f7c776" font-size="12" font-weight="bold" letter-spacing="1.5">AUTOMATION</text><text x="1084" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Build your workflow</text><text x="1084" y="148" fill="#b9c8e4" font-size="15">Submit lists and control downloads</text><text x="1084" y="173" fill="#b9c8e4" font-size="15">through a local application API.</text></g></svg>