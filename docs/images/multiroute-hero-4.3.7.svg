<text x="64" y="134" fill="#f2f6ff" font-size="67" font-weight="bold" letter-spacing="-2">MultiRoute</text><text x="64" y="205" fill="url(#accent)" font-size="67" font-weight="bold" letter-spacing="-2">Downloader</text>
<text x="67" y="266" fill="#f0f4ff" font-size="29" font-weight="bold">More connections. One download.</text><text x="67" y="307" fill="#b9c8e4" font-size="21">Put your independent Internet connections to work.</text><text x="67" y="338" fill="#b9c8e4" font-size="21">Keep large files moving when a connection fails.</text>
