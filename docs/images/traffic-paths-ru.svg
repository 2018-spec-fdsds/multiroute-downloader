<text x="490" y="149" class="mono" text-anchor="middle">192.168.1.1</text>
<path d="M579 143H680" fill="none" stroke="#66dbc3" stroke-width="2"/>
<path d="M337 182H399" fill="none" stroke="#66dbc3" stroke-width="2" marker-end="url(#green)"/>
<rect x="401" y="167" width="178" height="30" rx="9" fill="#172637" stroke="#66dbc3" stroke-width="1.4"/>
<text x="490" y="188" class="mono" text-anchor="middle">192.168.1.2</text>
<path d="M579 182H680" fill="none" stroke="#66dbc3" stroke-width="2"/>
<path d="M337 221H399" fill="none" stroke="#66dbc3" stroke-width="2" marker-end="url(#green)"/>
<rect x="401" y="206" width="178" height="30" rx="9" fill="#172637" stroke="#66dbc3" stroke-width="1.4"/>
<text x="490" y="227" class="mono" text-anchor="middle">192.168.1.3</text>
<path d="M579 221H680" fill="none" stroke="#66dbc3" stroke-width="2"/>
<path d="M337 260H399" fill="none" stroke="#66dbc3" stroke-width="2" marker-end="url(#green)"/>
<rect x="401" y="245" width="178" height="30" rx="9" fill="#172637" stroke="#66dbc3" stroke-width="1.4"/>
<text x="490" y="266" class="mono" text-anchor="middle">192.168.1.4</text>
<path d="M579 260H680" fill="none" stroke="#66dbc3" stroke-width="2"/>
<path d="M680 143V260 M680 184H792" fill="none" stroke="#66dbc3" stroke-width="2" marker-end="url(#green)"/>
<rect x="794" y="152" width="267" height="64" rx="9" fill="#172637" stroke="#66dbc3" stroke-width="1.4"/>
<text x="927.5" y="177" class="node" text-anchor="middle">URL файла или видео</text>
<text x="927.5" y="202" class="mono" text-anchor="middle">HTTPS</text>
<text x="45" y="303" class="sub" text-anchor="start">Другие приложения используют IP ОС 192.168.1.60 и шлюз Ethernet 192.168.1.3.</text>
<rect x="22" y="338" width="1076" height="246" rx="9" fill="#172637" stroke="#385166" stroke-width="1.4"/>
<text x="44" y="374" class="heading" text-anchor="start">С системным VPN</text>
<rect x="46" y="397" width="135" height="64" rx="9" fill="#172637" stroke="#86b7ff" stroke-width="1.4"/>
<text x="113.5" y="422" class="node" text-anchor="middle">MultiRoute</text>
<text x="113.5" y="447" class="mono" text-anchor="middle">OS</text>
<rect x="220" y="397" width="186" height="64" rx="9" fill="#172637" stroke="#86b7ff" stroke-width="1.4"/>
<text x="313.0" y="422" class="node" text-anchor="middle">Прокси ОС</text>
<text x="313.0" y="447" class="mono" text-anchor="middle">127.0.0.1:10809</text>
<rect x="446" y="397" width="196" height="64" rx="9" fill="#172637" stroke="#86b7ff" stroke-width="1.4"/>
<text x="544.0" y="422" class="node" text-anchor="middle">IP ОС в локальной сети</text>
<text x="544.0" y="447" class="mono" text-anchor="middle">192.168.1.60</text>
<rect x="681" y="397" width="146" height="64" rx="9" fill="#172637" stroke="#86b7ff" stroke-width="1.4"/>
<text x="754.0" y="422" class="node" text-anchor="middle">Выход VPN</text>
<text x="754.0" y="447" class="mono" text-anchor="middle">VPN</text>
<rect x="869" y="397" width="194" height="64" rx="9" fill="#172637" stroke="#86b7ff" stroke-width="1.4"/>
<text x="966.0" y="422" class="node" text-anchor="middle">URL / CDN</text>
<text x="966.0" y="447" class="mono" text-anchor="middle">HTTPS</text>
<path d="M181 429H218" fill="none" stroke="#86b7ff" stroke-width="2" marker-end="url(#blue)"/>
<path d="M406 429H444" fill="none" stroke="#86b7ff" stroke-width="2" marker-end="url(#blue)"/>
<path d="M642 429H679" fill="none" stroke="#86b7ff" stroke-width="2" marker-end="url(#blue)"/>
<path d="M827 429H867" fill="none" stroke="#86b7ff" stroke-width="2" marker-end="url(#blue)"/>
<text x="46" y="497" class="sub" text-anchor="start">Системный путь считается одним выходом. Виртуальный путь проверяется отдельно для этого URL.</text>
<text x="46" y="551" class="node" text-anchor="start">Виртуальный IP 192.168.1.70</text>
<path d="M304 546H414" fill="none" stroke="#66dbc3" stroke-width="2" marker-end="url(#green)" stroke-dasharray="5 4"/>
<text x="432" y="551" class="node" text-anchor="start">Выбранные шлюзы</text>
<path d="M628 546H780" fill="none" stroke="#66dbc3" stroke-width="2" marker-end="url(#green)" stroke-dasharray="5 4"/>
<text x="802" y="551" class="node" text-anchor="start">Проверка URL</text>
<text x="32" y="617" class="sub" text-anchor="start">Стрелки показывают направление запросов. Данные файла возвращаются по соответствующему пути.</text>
</svg>
