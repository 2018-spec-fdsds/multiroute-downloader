<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">Два пути к одному URL</title><desc id="desc">MultiRoute: 192.168.1.60 / 192.168.1.70</desc>
<style>text{font-family:Segoe UI,Arial,sans-serif;fill:#f2f7ff}.sub{fill:#b5c9d9;font-size:16px}.mono{font-family:Consolas,monospace;font-size:18px}.node{font-weight:600;font-size:17px}.heading{font-size:24px;font-weight:bold}</style>
<rect width="1120" height="640" rx="18" fill="#101b29"/>
<defs><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#66dbc3"/></marker></defs>
<defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#86b7ff"/></marker></defs>
<text x="32" y="39" class="heading" text-anchor="start">Два пути к одному URL</text>
<rect x="22" y="56" width="1076" height="268" rx="9" fill="#172637" stroke="#385166" stroke-width="1.4"/>
<text x="44" y="90" class="heading" text-anchor="start">Без VPN</text>
<rect x="48" y="152" width="246" height="64" rx="9" fill="#172637" stroke="#66dbc3" stroke-width="1.4"/>
<text x="171.0" y="177" class="node" text-anchor="middle">Виртуальный IP MultiRoute</text>
<text x="171.0" y="202" class="mono" text-anchor="middle">192.168.1.70</text>
