<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="214" viewBox="0 0 1400 214" role="img" aria-labelledby="title" lang="ar" xml:lang="ar"><title id="title">سعة أكبر، وتنزيلات تتحمل الانقطاع، وسلامة الملفات، وأتمتة</title><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="22" y="25" width="35" height="4" rx="2" fill="#5cbaff"></rect><text x="316" y="63" fill="#5cbaff" font-size="12" font-weight="bold" letter-spacing="0" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif">بوابات متعددة</text><text x="316" y="104" fill="#f0f4ff" font-size="26" font-weight="bold" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif" letter-spacing="0">سعة أكبر</text><text x="316" y="148" fill="#b9c8e4" font-size="15" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif" letter-spacing="0">وزّع مقاطع الملفات على</text><text x="316" y="173" fill="#b9c8e4" font-size="15" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif" letter-spacing="0">وصلات إنترنت مستقلة.</text><rect x="354" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="376" y="25" width="35" height="4" rx="2" fill="#5eead4"></rect><text x="670" y="63" fill="#5eead4" font-size="12" font-weight="bold" letter-spacing="0" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif">تنزيلات تتحمل الانقطاع</text><text x="670" y="104" fill="#f0f4ff" font-size="26" font-weight="bold" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif" letter-spacing="0">احتفظ بتقدمك</text><text x="670" y="148" fill="#b9c8e4" font-size="15" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif" letter-spacing="0">استأنف النقل بعد الانقطاع؛</text><text x="670" y="173" fill="#b9c8e4" font-size="15" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif" letter-spacing="0">وانقل مهام المسار المتوقف.</text><rect x="708" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="730" y="25" width="35" height="4" rx="2" fill="#b49bff"></rect><text x="1024" y="63" fill="#b49bff" font-size="12" font-weight="bold" letter-spacing="0" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif">سلامة الملفات</text><text x="1024" y="104" fill="#f0f4ff" font-size="26" font-weight="bold" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif" letter-spacing="0">تحقق من النتيجة</text><text x="1024" y="148" fill="#b9c8e4" font-size="15" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif" letter-spacing="0">قارن القيم المنشورة أو المقدمة</text><text x="1024" y="173" fill="#b9c8e4" font-size="15" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif" letter-spacing="0">من SHA-256 وSHA-512 وMD5.</text><rect x="1062" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="1084" y="25" width="35" height="4" rx="2" fill="#f7c776"></rect><text x="1378" y="63" fill="#f7c776" font-size="12" font-weight="bold" letter-spacing="0" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif">أتمتة</text><text x="1378" y="104" fill="#f0f4ff" font-size="26" font-weight="bold" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif" letter-spacing="0">نظّم سير عملك</text><text x="1378" y="148" fill="#b9c8e4" font-size="15" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif" letter-spacing="0">أرسل قوائم وتحكم في التنزيلات</text><text x="1378" y="173" fill="#b9c8e4" font-size="15" text-anchor="start" direction="rtl" unicode-bidi="plaintext" font-family="Tahoma,Arial,sans-serif" letter-spacing="0">عبر واجهة API محلية للتطبيق.</text></g></svg>
