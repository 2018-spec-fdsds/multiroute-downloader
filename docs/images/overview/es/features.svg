<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="214" viewBox="0 0 1400 214" role="img" aria-labelledby="title" lang="es" xml:lang="es"><title id="title">Más capacidad, descargas resistentes, integridad de archivos y automatización</title><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="22" y="25" width="35" height="4" rx="2" fill="#5cbaff"></rect><text x="22" y="63" fill="#5cbaff" font-size="12" font-weight="bold" letter-spacing="1.5">VARIAS PUERTAS DE ENLACE</text><text x="22" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Más capacidad</text><text x="22" y="148" fill="#b9c8e4" font-size="15">Reparte segmentos de archivos entre</text><text x="22" y="173" fill="#b9c8e4" font-size="15">conexiones a Internet independientes.</text><rect x="354" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="376" y="25" width="35" height="4" rx="2" fill="#5eead4"></rect><text x="376" y="63" fill="#5eead4" font-size="12" font-weight="bold" letter-spacing="1.5">DESCARGAS RESISTENTES</text><text x="376" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Conserva tus avances</text><text x="376" y="148" fill="#b9c8e4" font-size="15">Reanuda transferencias interrumpidas;</text><text x="376" y="173" fill="#b9c8e4" font-size="15">reasigna el trabajo de una ruta detenida.</text><rect x="708" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="730" y="25" width="35" height="4" rx="2" fill="#b49bff"></rect><text x="730" y="63" fill="#b49bff" font-size="12" font-weight="bold" letter-spacing="1.5">INTEGRIDAD DE ARCHIVOS</text><text x="730" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Verifica el resultado</text><text x="730" y="148" fill="#b9c8e4" font-size="15">Compara los valores publicados o dados</text><text x="730" y="173" fill="#b9c8e4" font-size="15">de SHA-256, SHA-512 y MD5.</text><rect x="1062" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="1084" y="25" width="35" height="4" rx="2" fill="#f7c776"></rect><text x="1084" y="63" fill="#f7c776" font-size="12" font-weight="bold" letter-spacing="1.5">AUTOMATIZACIÓN</text><text x="1084" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Crea tu flujo de trabajo</text><text x="1084" y="148" fill="#b9c8e4" font-size="15">Envía listas y controla las descargas</text><text x="1084" y="173" fill="#b9c8e4" font-size="15">mediante una API de aplicación local.</text></g></svg>
