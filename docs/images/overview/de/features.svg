<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="214" viewBox="0 0 1400 214" role="img" aria-labelledby="title" lang="de" xml:lang="de"><title id="title">Mehr Kapazität, robuste Downloads, Dateiintegrität und Automatisierung</title><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="22" y="25" width="35" height="4" rx="2" fill="#5cbaff"></rect><text x="22" y="63" fill="#5cbaff" font-size="12" font-weight="bold" letter-spacing="1.5">MEHRERE GATEWAYS</text><text x="22" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Mehr Kapazität</text><text x="22" y="148" fill="#b9c8e4" font-size="15">Dateisegmente verteilen auf</text><text x="22" y="173" fill="#b9c8e4" font-size="15">unabhängige Internetanschlüsse.</text><rect x="354" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="376" y="25" width="35" height="4" rx="2" fill="#5eead4"></rect><text x="376" y="63" fill="#5eead4" font-size="12" font-weight="bold" letter-spacing="1.5">ROBUSTE DOWNLOADS</text><text x="376" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Fortschritt behalten</text><text x="376" y="148" fill="#b9c8e4" font-size="15">Unterbrochene Transfers fortsetzen;</text><text x="376" y="173" fill="#b9c8e4" font-size="15">Arbeit stockender Routen neu verteilen.</text><rect x="708" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="730" y="25" width="35" height="4" rx="2" fill="#b49bff"></rect><text x="730" y="63" fill="#b49bff" font-size="12" font-weight="bold" letter-spacing="1.5">DATEIINTEGRITÄT</text><text x="730" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Ergebnis prüfen</text><text x="730" y="148" fill="#b9c8e4" font-size="15">Veröffentlichte oder vorgegebene</text><text x="730" y="173" fill="#b9c8e4" font-size="12.971556550951847">SHA-256-, SHA-512- und MD5-Werte vergleichen.</text><rect x="1062" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="1084" y="25" width="35" height="4" rx="2" fill="#f7c776"></rect><text x="1084" y="63" fill="#f7c776" font-size="12" font-weight="bold" letter-spacing="1.5">AUTOMATISIERUNG</text><text x="1084" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Abläufe gestalten</text><text x="1084" y="148" fill="#b9c8e4" font-size="15">Listen senden und Downloads steuern</text><text x="1084" y="173" fill="#b9c8e4" font-size="15">über die lokale Anwendungs-API.</text></g></svg>
