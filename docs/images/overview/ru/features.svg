<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="214" viewBox="0 0 1400 214" role="img" aria-labelledby="title" lang="ru" xml:lang="ru"><title id="title">Больше скорости, устойчивая докачка, целостность файлов и автоматизация</title><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="22" y="25" width="35" height="4" rx="2" fill="#5cbaff"></rect><text x="22" y="63" fill="#5cbaff" font-size="12" font-weight="bold" letter-spacing="1.5">НЕСКОЛЬКО ШЛЮЗОВ</text><text x="22" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Больше скорости</text><text x="22" y="148" fill="#b9c8e4" font-size="15">Скачивайте части файла через</text><text x="22" y="173" fill="#b9c8e4" font-size="15">независимые выходы в интернет.</text><rect x="354" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="376" y="25" width="35" height="4" rx="2" fill="#5eead4"></rect><text x="376" y="63" fill="#5eead4" font-size="12" font-weight="bold" letter-spacing="1.5">УСТОЙЧИВАЯ ДОКАЧКА</text><text x="376" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Сохраняйте прогресс</text><text x="376" y="148" fill="#b9c8e4" font-size="15">Продолжайте прерванную загрузку,</text><text x="376" y="173" fill="#b9c8e4" font-size="15">передавайте части другим шлюзам.</text><rect x="708" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="730" y="25" width="35" height="4" rx="2" fill="#b49bff"></rect><text x="730" y="63" fill="#b49bff" font-size="12" font-weight="bold" letter-spacing="1.5">ЦЕЛОСТНОСТЬ ФАЙЛОВ</text><text x="730" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Проверьте результат</text><text x="730" y="148" fill="#b9c8e4" font-size="15">Сверяйте с эталонами источника:</text><text x="730" y="173" fill="#b9c8e4" font-size="15">SHA-256, SHA-512 и MD5.</text><rect x="1062" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="1084" y="25" width="35" height="4" rx="2" fill="#f7c776"></rect><text x="1084" y="63" fill="#f7c776" font-size="12" font-weight="bold" letter-spacing="1.5">АВТОМАТИЗАЦИЯ</text><text x="1084" y="104" fill="#f0f4ff" font-size="24.70083380054271" font-weight="bold">Создайте свой процесс</text><text x="1084" y="148" fill="#b9c8e4" font-size="15">Передавайте списки и управляйте</text><text x="1084" y="173" fill="#b9c8e4" font-size="15">загрузками через локальный API.</text></g></svg>
