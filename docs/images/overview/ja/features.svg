<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="214" viewBox="0 0 1400 214" role="img" aria-labelledby="title" lang="ja" xml:lang="ja"><title id="title">帯域の活用、障害に強いダウンロード、ファイルの完全性、自動化</title><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="22" y="25" width="35" height="4" rx="2" fill="#5cbaff"></rect><text x="22" y="63" fill="#5cbaff" font-size="12" font-weight="bold" letter-spacing="1.5">マルチゲートウェイ</text><text x="22" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">帯域をもっと活用</text><text x="22" y="148" fill="#b9c8e4" font-size="15">独立したインターネット回線で</text><text x="22" y="173" fill="#b9c8e4" font-size="15">ファイルのセグメントを分担。</text><rect x="354" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="376" y="25" width="35" height="4" rx="2" fill="#5eead4"></rect><text x="376" y="63" fill="#5eead4" font-size="12" font-weight="bold" letter-spacing="1.5">障害に強いダウンロード</text><text x="376" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">進行状況を保持</text><text x="376" y="148" fill="#b9c8e4" font-size="15">中断した転送を再開し、</text><text x="376" y="173" fill="#b9c8e4" font-size="15">止まった経路のタスクを再割り当て。</text><rect x="708" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="730" y="25" width="35" height="4" rx="2" fill="#b49bff"></rect><text x="730" y="63" fill="#b49bff" font-size="12" font-weight="bold" letter-spacing="1.5">ファイルの完全性</text><text x="730" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">結果を検証</text><text x="730" y="148" fill="#b9c8e4" font-size="15">公開・提供された値と照合：</text><text x="730" y="173" fill="#b9c8e4" font-size="15">SHA-256、SHA-512、MD5。</text><rect x="1062" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="1084" y="25" width="35" height="4" rx="2" fill="#f7c776"></rect><text x="1084" y="63" fill="#f7c776" font-size="12" font-weight="bold" letter-spacing="1.5">自動化</text><text x="1084" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">作業の流れをつくる</text><text x="1084" y="148" fill="#b9c8e4" font-size="15">アプリのローカル API から</text><text x="1084" y="173" fill="#b9c8e4" font-size="15">一覧を送信し、ダウンロードを制御。</text></g></svg>
