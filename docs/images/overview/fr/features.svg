<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="214" viewBox="0 0 1400 214" role="img" aria-labelledby="title" lang="fr" xml:lang="fr"><title id="title">Plus de capacité, téléchargements résistants, intégrité des fichiers et automatisation</title><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="22" y="25" width="35" height="4" rx="2" fill="#5cbaff"></rect><text x="22" y="63" fill="#5cbaff" font-size="12" font-weight="bold" letter-spacing="1.5">PLUSIEURS PASSERELLES</text><text x="22" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Plus de capacité</text><text x="22" y="148" fill="#b9c8e4" font-size="15">Répartissez les segments entre</text><text x="22" y="173" fill="#b9c8e4" font-size="15">des accès Internet indépendants.</text><rect x="354" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="376" y="25" width="35" height="4" rx="2" fill="#5eead4"></rect><text x="376" y="63" fill="#5eead4" font-size="12" font-weight="bold" letter-spacing="1.5">TRANSFERTS RÉSISTANTS</text><text x="376" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Gardez vos progrès</text><text x="376" y="148" fill="#b9c8e4" font-size="15">Reprenez les transferts interrompus ;</text><text x="376" y="173" fill="#b9c8e4" font-size="15">réaffectez le travail d’une route bloquée.</text><rect x="708" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="730" y="25" width="35" height="4" rx="2" fill="#b49bff"></rect><text x="730" y="63" fill="#b49bff" font-size="12" font-weight="bold" letter-spacing="1.5">INTÉGRITÉ DES FICHIERS</text><text x="730" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Vérifiez le résultat</text><text x="730" y="148" fill="#b9c8e4" font-size="15">Comparez les valeurs publiées ou fournies</text><text x="730" y="173" fill="#b9c8e4" font-size="15">de SHA-256, SHA-512 et MD5.</text><rect x="1062" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="1084" y="25" width="35" height="4" rx="2" fill="#f7c776"></rect><text x="1084" y="63" fill="#f7c776" font-size="12" font-weight="bold" letter-spacing="1.5">AUTOMATISATION</text><text x="1084" y="104" fill="#f0f4ff" font-size="23.791732991014122" font-weight="bold">Créez votre flux de travail</text><text x="1084" y="148" fill="#b9c8e4" font-size="15">Envoyez des listes, pilotez les transferts</text><text x="1084" y="173" fill="#b9c8e4" font-size="15">via une API applicative locale.</text></g></svg>
