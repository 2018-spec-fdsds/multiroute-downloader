<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="214" viewBox="0 0 1400 214" role="img" aria-labelledby="title" lang="it" xml:lang="it"><title id="title">Più capacità, download resistenti, integrità dei file e automazione</title><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="22" y="25" width="35" height="4" rx="2" fill="#5cbaff"></rect><text x="22" y="63" fill="#5cbaff" font-size="12" font-weight="bold" letter-spacing="1.5">PIÙ GATEWAY</text><text x="22" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Più capacità</text><text x="22" y="148" fill="#b9c8e4" font-size="15">Distribuisci i segmenti dei file su</text><text x="22" y="173" fill="#b9c8e4" font-size="15">connessioni Internet indipendenti.</text><rect x="354" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="376" y="25" width="35" height="4" rx="2" fill="#5eead4"></rect><text x="376" y="63" fill="#5eead4" font-size="12" font-weight="bold" letter-spacing="1.5">DOWNLOAD RESISTENTI</text><text x="376" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Conserva i progressi</text><text x="376" y="148" fill="#b9c8e4" font-size="15">Riprendi i trasferimenti interrotti;</text><text x="376" y="173" fill="#b9c8e4" font-size="15">riassegna il lavoro delle route bloccate.</text><rect x="708" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="730" y="25" width="35" height="4" rx="2" fill="#b49bff"></rect><text x="730" y="63" fill="#b49bff" font-size="12" font-weight="bold" letter-spacing="1.5">INTEGRITÀ DEI FILE</text><text x="730" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Verifica il risultato</text><text x="730" y="148" fill="#b9c8e4" font-size="15">Confronta i valori pubblicati o forniti</text><text x="730" y="173" fill="#b9c8e4" font-size="15">di SHA-256, SHA-512 e MD5.</text><rect x="1062" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="1084" y="25" width="35" height="4" rx="2" fill="#f7c776"></rect><text x="1084" y="63" fill="#f7c776" font-size="12" font-weight="bold" letter-spacing="1.5">AUTOMAZIONE</text><text x="1084" y="104" fill="#f0f4ff" font-size="23.05256061353545" font-weight="bold">Crea il tuo flusso di lavoro</text><text x="1084" y="148" fill="#b9c8e4" font-size="15">Invia elenchi e controlla i download</text><text x="1084" y="173" fill="#b9c8e4" font-size="15">tramite un’API applicativa locale.</text></g></svg>
