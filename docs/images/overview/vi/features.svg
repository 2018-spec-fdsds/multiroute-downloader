<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="214" viewBox="0 0 1400 214" role="img" aria-labelledby="title" lang="vi" xml:lang="vi"><title id="title">Thêm băng thông, tải bền bỉ, toàn vẹn tệp và tự động hóa</title><g font-family="Arial,Helvetica,sans-serif"><rect x="0" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="22" y="25" width="35" height="4" rx="2" fill="#5cbaff"></rect><text x="22" y="63" fill="#5cbaff" font-size="12" font-weight="bold" letter-spacing="1.5">NHIỀU CỔNG MẠNG</text><text x="22" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Thêm băng thông</text><text x="22" y="148" fill="#b9c8e4" font-size="15">Chia các phân đoạn tệp qua</text><text x="22" y="173" fill="#b9c8e4" font-size="15">các đường Internet độc lập.</text><rect x="354" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="376" y="25" width="35" height="4" rx="2" fill="#5eead4"></rect><text x="376" y="63" fill="#5eead4" font-size="12" font-weight="bold" letter-spacing="1.5">TẢI XUỐNG BỀN BỈ</text><text x="376" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Giữ lại tiến độ</text><text x="376" y="148" fill="#b9c8e4" font-size="15">Tiếp tục lượt tải bị gián đoạn;</text><text x="376" y="173" fill="#b9c8e4" font-size="15">chuyển việc từ tuyến bị kẹt.</text><rect x="708" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="730" y="25" width="35" height="4" rx="2" fill="#b49bff"></rect><text x="730" y="63" fill="#b49bff" font-size="12" font-weight="bold" letter-spacing="1.5">TOÀN VẸN TỆP</text><text x="730" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Xác minh kết quả</text><text x="730" y="148" fill="#b9c8e4" font-size="15">So giá trị công bố hoặc được cấp:</text><text x="730" y="173" fill="#b9c8e4" font-size="15">SHA-256, SHA-512 và MD5.</text><rect x="1062" y="1" width="338" height="212" rx="20" fill="#142039" stroke="#31415f"></rect><rect x="1084" y="25" width="35" height="4" rx="2" fill="#f7c776"></rect><text x="1084" y="63" fill="#f7c776" font-size="12" font-weight="bold" letter-spacing="1.5">TỰ ĐỘNG HÓA</text><text x="1084" y="104" fill="#f0f4ff" font-size="26" font-weight="bold">Tạo quy trình của bạn</text><text x="1084" y="148" fill="#b9c8e4" font-size="15">Gửi danh sách, điều khiển tải</text><text x="1084" y="173" fill="#b9c8e4" font-size="15">qua API cục bộ của ứng dụng.</text></g></svg>
