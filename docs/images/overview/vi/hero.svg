<text x="67" y="266" fill="#f0f4ff" font-size="29" font-weight="bold">Nhiều kết nối. Một lượt tải.</text><text x="67" y="307" fill="#b9c8e4" font-size="21">Tận dụng các kết nối Internet độc lập của bạn.</text><text x="67" y="338" fill="#b9c8e4" font-size="21">Tiếp tục tải tệp lớn khi một kết nối gặp sự cố.</text>
