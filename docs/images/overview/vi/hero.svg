<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc" lang="vi" xml:lang="vi">
<title id="title">MultiRoute Downloader — nhiều kết nối, một lượt tải</title><desc id="desc">Minh họa bốn cổng Internet độc lập cùng tải một tệp có hỗ trợ tiếp tục tải. Chỉ là minh họa, không phải tốc độ truyền đo được.</desc>
