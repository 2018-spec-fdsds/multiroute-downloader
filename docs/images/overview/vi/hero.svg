<g font-family="Arial,Helvetica,sans-serif"><text x="64" y="52" fill="#96add4" font-size="15" letter-spacing="3">TRÌNH QUẢN LÝ TẢI XUỐNG CHO MÁY TÍNH</text><rect x="1228" y="25" width="108" height="34" rx="17" fill="#ffffff" fill-opacity=".08" stroke="#9cafff" stroke-opacity=".3"></rect><text x="1282" y="48" text-anchor="middle" fill="#dae7ff" font-size="16" font-weight="bold">v4.3.7</text>
